<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="get" name="dbForm">
        <fieldset>
            <legend>회원가입</legend>
            <ul>
                <li>
                    <label >아이디 :</label>
                    <input type="text" name="loginid" id="loginid" maxlength="10" value="1234" required>
                </li>
                <li>
                    <label >패스워드 :</label>
                    <input type="password" name="password" id="passwd" maxlength="10">
                </li>
                <li>
                    <label >이메일 :</label><input type="email" name="email">
                </li>
                <li>
                    <label >홈페이지 주소 :</label><input type="url" name="homepage">
                </li>
                <li>
                    <label >전화번호 :</label><input type="tel" name="phone">
                </li>
                <li>
                    <label>직업 : </label>
                    <label><input type="radio" name="job" value="학생">학생</label>
                    <label><input type="radio" name="job" value="회사원">회사원</label>
                </li>
                <li>
                    <label>취미 : </label>
                    <label><input type="checkbox" name="hobby" value="낚시">낚시</label>
                    <label><input type="checkbox" name="hobby" value="게임">게임</label>
                    <label><input type="checkbox" name="hobby" value="바둑">바둑</label>
                </li>
                <li>
                    <label>가족수 : </label>
                    <input type="number" min="0" max="10" name="countfamily" value="4">
                </li>
                <li>
                    <label>성적 : </label>
                    <input type="range" min="0" max="100"  step=10 name="score" value="20">
                </li>
                <li>
                    <label>생년월일 </label>
                    <input type="date" name="birthday">
                    <input type="time" name="birthday2">
                </li>
                
            </ul>
          <input type="submit" value="가입하기">
            
        </fieldset>
        
    </form>
    
    
</body>
</html>
